<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>效期管家</title>
<meta name="theme-color" content="#7B3F4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="效期管家">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<!--STYLE-START-->
<style>
/* Layout: 單欄手機 App — 頂部膠囊標籤＋大標題＋分隔線，總覽卡片，底部分頁列 */
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface-2:#F3F1EA; --ink:#22403F; --ink-2:#5E7472;
  --primary:#0D3B3E; --accent:#2E7D7D; --btn:#0D3B3E; --on-btn:#FFFFFF;
  --gold:#C9A961; --gold-deep:#8A6D28; --line:#DCE4E3; --line-strong:#C5D2D0;
  --danger:#A8412F; --danger-bg:#F8EBE7; --warn:#8F6410; --warn-bg:#F6EFDC;
  --ok:#2E6F57; --ok-bg:#E7F1EC; --info-bg:#E8F0EF; --backdrop:rgba(13,30,30,.42);
  --font:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --surface:#162221; --surface-2:#1C2B2A; --ink:#DDE8E6; --ink-2:#97ABA9;
  --primary:#9FD3CE; --accent:#6FB8B2; --btn:#2E7D7D; --on-btn:#FFFFFF;
  --gold:#C9A961; --gold-deep:#D8BD7E; --line:#2A3B3A; --line-strong:#3A4E4C;
  --danger:#E69482; --danger-bg:#3A2420; --warn:#E2B865; --warn-bg:#33291A;
  --ok:#86C9A8; --ok-bg:#1B3128; --info-bg:#1D2F2E; --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1817; --surface:#162221; --surface-2:#1C2B2A; --ink:#DDE8E6; --ink-2:#97ABA9;
  --primary:#9FD3CE; --accent:#6FB8B2; --btn:#2E7D7D; --on-btn:#FFFFFF;
  --gold:#C9A961; --gold-deep:#D8BD7E; --line:#2A3B3A; --line-strong:#3A4E4C;
  --danger:#E69482; --danger-bg:#3A2420; --warn:#E2B865; --warn-bg:#33291A;
  --ok:#86C9A8; --ok-bg:#1B3128; --info-bg:#1D2F2E; --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}

/* 主題色系：coral 珊瑚粉（未指定時為原版深藍綠） */
:root[data-palette="coral"]{--bg:#FFF8F8; --surface:#FFFFFF; --surface-2:#F9E2E2; --ink:#4A2E2B; --ink-2:#8A625D; --primary:#B8554A; --accent:#E07565; --btn:#D0655A; --on-btn:#FFFFFF; --gold:#EBB2AC; --gold-deep:#C0584C; --line:#F3DAD7; --line-strong:#EBB2AC; --info-bg:#F9E2E2; --week:#8A625D;}
@media (prefers-color-scheme:dark){:root[data-palette="coral"]:not([data-theme="light"]){--bg:#1C1414; --surface:#261B1B; --surface-2:#312222; --ink:#F7E6E4; --ink-2:#C3A19C; --primary:#F4A397; --accent:#EE8778; --btn:#C25A4D; --on-btn:#FFFFFF; --gold:#EBB2AC; --gold-deep:#F4B3A8; --line:#3D2B2A; --line-strong:#5A3D3A; --info-bg:#3A2524; --week:#C3A19C;}}
:root[data-palette="coral"][data-theme="dark"]{--bg:#1C1414; --surface:#261B1B; --surface-2:#312222; --ink:#F7E6E4; --ink-2:#C3A19C; --primary:#F4A397; --accent:#EE8778; --btn:#C25A4D; --on-btn:#FFFFFF; --gold:#EBB2AC; --gold-deep:#F4B3A8; --line:#3D2B2A; --line-strong:#5A3D3A; --info-bg:#3A2524; --week:#C3A19C;}
:root[data-palette="rose"]{--bg:#FBF7F6; --surface:#FFFFFF; --surface-2:#F5EDEC; --ink:#43302F; --ink-2:#7D6663; --primary:#7B3F4E; --accent:#B06A7A; --btn:#7B3F4E; --on-btn:#FFFFFF; --line:#EBDDDB; --line-strong:#DCC7C4; --info-bg:#F6E9EA; --week:#7D6663;}
@media (prefers-color-scheme:dark){:root[data-palette="rose"]:not([data-theme="light"]){--bg:#1A1314; --surface:#231A1B; --surface-2:#2C2122; --ink:#F1E4E3; --ink-2:#B9A09E; --primary:#E6B3BE; --accent:#D28E9C; --btn:#9A4E60; --on-btn:#FFFFFF; --line:#3A2C2D; --line-strong:#4B3839; --info-bg:#33242A; --week:#B9A09E;}}
:root[data-palette="rose"][data-theme="dark"]{--bg:#1A1314; --surface:#231A1B; --surface-2:#2C2122; --ink:#F1E4E3; --ink-2:#B9A09E; --primary:#E6B3BE; --accent:#D28E9C; --btn:#9A4E60; --on-btn:#FFFFFF; --line:#3A2C2D; --line-strong:#4B3839; --info-bg:#33242A; --week:#B9A09E;}
:root[data-palette="lavender"]{--bg:#F9F8FB; --surface:#FFFFFF; --surface-2:#F0EEF5; --ink:#34304A; --ink-2:#6F6A85; --primary:#4F4577; --accent:#7D71AE; --btn:#4F4577; --on-btn:#FFFFFF; --line:#E3E0EC; --line-strong:#D2CDE0; --info-bg:#ECE9F5;}
@media (prefers-color-scheme:dark){:root[data-palette="lavender"]:not([data-theme="light"]){--bg:#14131B; --surface:#1D1B26; --surface-2:#252330; --ink:#E8E6F2; --ink-2:#A7A2BE; --primary:#C4BAF0; --accent:#A597DE; --btn:#6456A0; --on-btn:#FFFFFF; --line:#312E40; --line-strong:#403C52; --info-bg:#272338;}}
:root[data-palette="lavender"][data-theme="dark"]{--bg:#14131B; --surface:#1D1B26; --surface-2:#252330; --ink:#E8E6F2; --ink-2:#A7A2BE; --primary:#C4BAF0; --accent:#A597DE; --btn:#6456A0; --on-btn:#FFFFFF; --line:#312E40; --line-strong:#403C52; --info-bg:#272338;}
.pal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pal{display:grid;gap:8px;justify-items:start;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-size:16px;color:var(--ink);min-width:0}
.pal[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:700}
.pal .dots{display:flex;gap:4px}
.pal .dots i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Header */
.head{display:grid;gap:6px;padding-top:calc(4px + env(safe-area-inset-top,0px))}
.capsule{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:14px;letter-spacing:.12em;color:var(--gold-deep);border:1px solid var(--gold);border-radius:999px;padding:3px 12px}
.head h1{margin:2px 0 0;font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--primary);text-wrap:balance}
.head .sub{color:var(--ink-2);font-size:16px}
.rule{position:relative;height:1px;background:var(--line);margin:12px 0 16px}
.rule::before{content:"";position:absolute;left:0;top:0;width:44px;height:1px;background:var(--gold)}

/* Section titles */
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-title h2{margin:0;font-size:19px;font-weight:700;color:var(--primary);letter-spacing:.03em}
.sec-title .hint{font-size:15px;color:var(--ink-2)}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;display:grid;gap:2px;text-align:left;min-width:0}
.stat .k{font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.stat .v{font-size:28px;font-weight:700;line-height:1.15}
.stat.expired .v{color:var(--danger)} .stat.soon .v{color:var(--warn)} .stat.week .v{color:var(--week,var(--accent))} .stat.all .v{color:var(--primary)}
.stat[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
@media (max-width:380px){.summary{grid-template-columns:repeat(2,1fr)}}

/* Toolbar */
.toolbar{display:grid;gap:10px;margin-top:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;height:44px}
.search svg{flex:none;color:var(--ink-2)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.subcost{margin-top:10px;background:var(--info-bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.subcost b{color:var(--primary)}

/* Groups & rows */
.group{margin-top:18px}
.group-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink-2);margin:0 0 8px;letter-spacing:.04em}
.group-h .dot{width:8px;height:8px;border-radius:50%}
.group-h .cnt{font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.days{display:grid;justify-items:center;border-radius:var(--r-sm);padding:6px 4px;line-height:1.1}
.days b{font-size:22px;font-weight:700}
.days small{font-size:13px;margin-top:2px}
.u-expired{background:var(--danger-bg);color:var(--danger)}
.u-soon{background:var(--warn-bg);color:var(--warn)}
.u-week{background:var(--info-bg);color:var(--week,var(--accent))}
.u-ok{background:var(--ok-bg);color:var(--ok)}
.u-none{background:var(--surface-2);color:var(--ink-2)}
.row .main{min-width:0}
.row .name{font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:15px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.row .date{font-size:15.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.row .date .src{display:block;font-size:13px;margin-top:2px}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;font-size:14px;line-height:18px;color:var(--ink-2)}
.tag.gold{border-color:var(--gold);color:var(--gold-deep)}

/* Empty */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;margin-top:18px;display:grid;gap:14px}
.empty h3{margin:0;font-size:20px;color:var(--primary)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:17px}
.badge{width:26px;height:26px;border-radius:7px;background:var(--gold-deep);color:#fff;display:grid;place-items:center;font-size:14.5px;font-weight:700}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--btn);background:var(--btn);color:var(--on-btn);font-size:17.5px;font-weight:600}
.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line-strong)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 auto}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:16px;text-decoration:underline;text-underline-offset:3px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:14px;color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}
.tab.add .plus{width:44px;height:30px;border-radius:999px;background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);display:grid;place-items:center}
.tab.add .plus svg{width:20px;height:20px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--backdrop)}
.panel{background:var(--bg);width:100%;max-width:680px;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.panel-h h3{margin:0;font-size:20px;color:var(--primary)}
.panel-b{overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;grid-auto-rows:max-content;align-content:start;min-height:0;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px;max-height:88dvh}}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;height:36px;font-size:16.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);font-weight:700;box-shadow:0 0 0 1px var(--line-strong)}

/* Cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h .t{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:15px;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;min-width:0;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 12px;font-size:18px}
.f textarea{height:auto;min-height:120px;padding:10px 12px;resize:vertical}
.f select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.f .help{font-size:14.5px;color:var(--ink-2)}
.f .help.ok{color:var(--ok)} .f .help.bad{color:var(--danger)}
.date-wrap{display:flex;gap:6px}
.date-wrap input[type=text]{flex:1}
.pick{position:relative;flex:none;width:44px;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.scanbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 12px;border:1px solid var(--accent);border-radius:var(--r-sm);background:var(--surface);color:var(--accent);font-size:16px;font-weight:600}
.scanbtn svg{width:20px;height:20px}
.overlay{z-index:50}
.crop-stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.crop-img{display:block;width:100%;height:auto;pointer-events:none}
.crop-box{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:4px;pointer-events:none}
.scan-img{width:100%;max-height:240px;object-fit:contain;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.pick-list{display:grid;gap:8px}
.cand{display:grid;gap:2px;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:17px}
.cand small{color:var(--ink-2);font-size:14px}
.cand.best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.line-chips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:17px;text-align:left;max-width:100%;overflow-wrap:anywhere}
.lchip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.switch{display:flex;align-items:center;gap:10px;height:44px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.note{font-size:15.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.note b{color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.status{font-size:16px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* History */
.hist-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .name{font-weight:600}
.hrow .meta{font-size:15px;color:var(--ink-2)}

/* Settings table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table.rules{width:100%;border-collapse:collapse;font-size:16.5px;min-width:350px;table-layout:auto}
table.rules th,table.rules td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.rules th{font-size:14.5px;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
table.rules tr:last-child td{border-bottom:0}
table.rules tr.grp td{background:var(--surface-2);color:var(--gold-deep);font-size:14.5px;font-weight:700;letter-spacing:.08em;padding:6px 10px}
table.rules th.rm{color:var(--primary);white-space:nowrap}
table.rules input{width:100%;min-width:46px;height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 2px;font-size:18px;text-align:center}
table.sub-rules input{width:88px}
table.sub-rules td:last-child,table.sub-rules th:last-child{text-align:right;padding-right:10px}
table.rules td:first-child,table.rules th:first-child{white-space:nowrap;padding-left:10px;padding-right:6px}
table.rules th:not(:first-child){text-align:center}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

.ver-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px;color:var(--ink-2);margin-bottom:4px}
.ver-line .tag{font-size:14px;line-height:22px;padding:0 8px}
.cp-row{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.cp-row:first-child{border-top:0}
.cp-go{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cp-row input{width:22px;height:22px;accent-color:var(--primary)}

.cp-row .meta{font-size:15px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:grid;gap:12px}
.lock-card .capsule{justify-self:start}
.lock-title{margin:0;font-size:30px;color:var(--primary);letter-spacing:.04em}
.lock-sub{margin:0;color:var(--ink-2);font-size:16px}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;margin-top:12px}

<script>
"use strict";
/* ============ 常數與預設 ============ */
const APP_VERSION = "1.5.0";
const LOCS = ["冷藏","冷凍","常溫"];
const ITEM_GROUPS = [
  ["生鮮食材", ["葉菜類","根莖瓜果","水果","肉類","海鮮","蛋","豆製品","乳製品","熟食剩菜","麵包烘焙"]],
  ["包裝與乾貨", ["冷凍食品","包裝食品","乾貨穀物","調味料","飲料"]],
  ["藥品與保健", ["藥品","保健食品"]],
  ["日用品", ["保養化妝品","個人清潔用品","居家清潔用品","其他日用品"]],
  ["其他", ["其他"]]
];
const ITEM_CATS = ITEM_GROUPS.flatMap(g => g[1]);
const SUB_CATS = ["軟體／App","影音串流","雲端服務","會員卡","其他訂閱"];
const CYCLES = ["月繳","年繳","一次性"];
const SOURCES = ["標示日期","規則推算","週期推算","手動輸入"];
// [類別, 冷藏天數, 冷凍天數, 常溫天數, 提前提醒天數]；0＝不適合此存放方式，需依包裝填寫
const RULES_VERSION = 2;
const DEFAULT_RULES = [
  ["葉菜類",5,30,1,1],["根莖瓜果",14,90,14,2],["水果",7,180,3,1],["肉類",2,120,0,1],["海鮮",1,90,0,1],
  ["蛋",21,0,7,3],["豆製品",3,30,0,1],["乳製品",7,30,0,2],["熟食剩菜",3,30,0,1],["麵包烘焙",5,30,3,1],
  ["冷凍食品",2,180,0,14],["包裝食品",30,0,180,14],["乾貨穀物",180,365,365,30],["調味料",180,0,365,30],["飲料",30,0,180,14],
  ["藥品",730,0,730,90],["保健食品",730,0,730,60],
  ["保養化妝品",730,0,730,60],["個人清潔用品",1095,0,1095,30],["居家清潔用品",1095,0,1095,30],["其他日用品",1095,0,1095,30],
  ["其他",7,30,7,3]
].map(([cat,fridge,freezer,room,remind])=>({cat,fridge,freezer,room,remind}));
const DEFAULT_SUB_RULES = [["軟體／App",7],["影音串流",3],["雲端服務",14],["會員卡",30],["其他訂閱",7]].map(([cat,remind])=>({cat,remind}));
const LEGACY_CATS = { "保健藥品": "藥品", "日用品": "其他日用品" };
const DEFAULT_SETTINGS = {
  alarmHour: 9, rulesVersion: RULES_VERSION,
  rules: DEFAULT_RULES, subRules: DEFAULT_SUB_RULES,
  ai: { key: "", model: "gemini-flash-latest" },
  palette: "rose"
};
const PALETTES = [
  { id: "teal", name: "深藍綠", note: "", colors: ["#0D3B3E", "#2E7D7D", "#C9A961", "#FAF8F3"], meta: "#0D3B3E" },
  { id: "coral", name: "珊瑚粉", note: "", colors: ["#EE8778", "#EBB2AC", "#F9E2E2", "#FFF8F8"], meta: "#EE8778" },
  { id: "rose", name: "玫瑰霧", note: "預設", colors: ["#7B3F4E", "#B06A7A", "#C9A961", "#FBF7F6"], meta: "#7B3F4E" },
  { id: "lavender", name: "薰衣草灰", note: "", colors: ["#4F4577", "#7D71AE", "#C9A961", "#F9F8FB"], meta: "#4F4577" }
];
function applyPalette(id) {
  const p = PALETTES.find(x => x.id === id) || PALETTES.find(x => x.id === DEFAULT_SETTINGS.palette);
  if (p.id === "teal") delete document.documentElement.dataset.palette; else document.documentElement.dataset.palette = p.id;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
const STATUS_LABEL = { used:"已用完", discarded:"已丟棄", cancelled:"已取消" };

/* ============ 狀態 ============ */
let state = { version: 1, items: [], settings: structuredClone(DEFAULT_SETTINGS) };
let ui = { tab: "overview", loc: "全部", urgency: null, q: "" };
let storageMode = "idb"; // idb | local | memory

/* ============ 小工具 ============ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "svg") el.innerHTML = v; // 僅用於本檔內建的靜態圖示
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let fieldSeq = 0; const fid = (p) => p + "-" + (++fieldSeq);

function pad(n) { return String(n).padStart(2, "0"); }
function fmt(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function isISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmt(parseISO(s)) === s; }
function today() { return fmt(new Date()); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return fmt(d); }
function addMonths(s, n) {
  const d = parseISO(s); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return fmt(d);
}
function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
const WD = ["日","一","二","三","四","五","六"];
function prettyDate(s) { const d = parseISO(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${WD[d.getDay()]}）`; }
function shortDate(s) { const d = parseISO(s); const y = d.getFullYear() === new Date().getFullYear() ? "" : d.getFullYear() + "/"; return `${y}${d.getMonth()+1}/${d.getDate()}`; }
function money(n) { return "NT$" + Math.round(n).toLocaleString("zh-TW"); }

/* ============ 日期文字解析（掃描文字／手打） ============ */
function toHalf(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248))
    .replace(/[．。]/g, ".").replace(/[／]/g, "/").replace(/[－—–‐]/g, "-").replace(/：/g, ":");
}
function validYMD(y, m, d) {
  if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
  const dt = new Date(y, m - 1, d); return dt.getMonth() === m - 1 ? fmt(dt) : null;
}
function monthEnd(y, m) { if (m < 1 || m > 12 || y < 1990 || y > 2100) return null; return fmt(new Date(y, m, 0)); }
function yearFix(y) { y = +y; if (y < 100) return 2000 + y; if (y < 1000) return y + 1911; return y; }
function parseToken(t) {
  let m;
  if ((m = t.match(/^(\d{3,4})[.\/\-年](\d{1,2})[.\/\-月](\d{1,2})日?$/))) {
    const r = validYMD(yearFix(m[1]), +m[2], +m[3]); if (r) return { date: r, how: m[1].length === 3 ? "民國年月日" : "年月日" };
  }
  if ((m = t.match(/^(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})$/))) {
    let d = +m[1], mo = +m[2]; let how = "日/月/年";
    if (d <= 12 && mo > 12) { [d, mo] = [mo, d]; how = "月/日/年"; }
    const r = validYMD(+m[3], mo, d); if (r) return { date: r, how };
  }
  if ((m = t.match(/^(\d{2})[.\/\-](\d{1,2})[.\/\-](\d{1,2})$/))) {
    const r = validYMD(2000 + +m[1], +m[2], +m[3]); if (r) return { date: r, how: "年月日（西元末兩碼）" };
  }
  if ((m = t.match(/^(\d{4})(\d{2})(\d{2})$/))) { const r = validYMD(+m[1], +m[2], +m[3]); if (r) return { date: r, how: "年月日" }; }
  if ((m = t.match(/^(\d{3})(\d{2})(\d{2})$/))) { const r = validYMD(+m[1] + 1911, +m[2], +m[3]); if (r) return { date: r, how: "民國年月日" }; }
  if ((m = t.match(/^(\d{2})(\d{2})(\d{2})$/))) { const r = validYMD(2000 + +m[1], +m[2], +m[3]); if (r) return { date: r, how: "年月日（西元末兩碼）" }; }
  if ((m = t.match(/^(\d{3,4})[.\/\-年](\d{1,2})月?$/))) { const r = monthEnd(yearFix(m[1]), +m[2]); if (r) return { date: r, how: "只有年月，取當月最後一天" }; }
  if ((m = t.match(/^(\d{1,2})[.\/\-](\d{4})$/))) { const r = monthEnd(+m[2], +m[1]); if (r) return { date: r, how: "只有月年，取當月最後一天" }; }
  return null;
}
function parseDateText(raw) {
  if (!raw) return null;
  const s = toHalf(String(raw)).replace(/\s+/g, "");
  if (isISO(s)) return { date: s, how: "" };
  const re = /\d{1,4}[.\/\-年]\d{1,2}[.\/\-月]\d{1,4}日?|\d{3,4}[.\/\-年]\d{1,2}月?|\d{1,2}[.\/\-]\d{4}|\d{6,8}/g;
  const kw = s.search(/有效|到期|期限|賞味|EXP|BB|BEST|USE/i);
  const found = [];
  let m; while ((m = re.exec(s))) { const p = parseToken(m[0]); if (p) found.push({ ...p, at: m.index }); }
  if (!found.length) return null;
  if (kw >= 0) { const after = found.find(f => f.at >= kw); if (after) return after; }
  return found.reduce((a, b) => (b.date > a.date ? b : a));
}

/* ============ 規則推算 ============ */
function ruleDays(cat, loc) {
  const r = state.settings.rules.find(x => x.cat === cat); if (!r) return 0;
  return loc === "冷藏" ? r.fridge : loc === "冷凍" ? r.freezer : r.room;
}
function defaultLoc(cat) {
  if (cat === "冷凍食品") return "冷凍";
  if (["根莖瓜果","麵包烘焙","包裝食品","乾貨穀物","調味料","飲料","藥品","保健食品","保養化妝品","個人清潔用品","居家清潔用品","其他日用品"].includes(cat)) return "常溫";
  return "冷藏";
}
function catRemind(kind, cat) {
  const list = kind === "sub" ? state.settings.subRules : state.settings.rules;
  const r = list.find(x => x.cat === cat); return r ? r.remind : (kind === "sub" ? 7 : 3);
}
function urgency(it) {
  if (!it.expiry) return "none";
  const d = diffDays(today(), it.expiry);
  if (d < 0) return "expired"; if (d <= 3) return "soon"; if (d <= 7) return "week"; return "ok";
}
function daysLabel(it) {
  if (!it.expiry) return { big: "—", small: "未填日期" };
  const d = diffDays(today(), it.expiry);
  if (d === 0) return { big: "今", small: "今天到期" };
  const a = Math.abs(d), past = d < 0;
  if (a <= 60) return { big: String(a), small: past ? "天前到期" : "天後" };
  const months = a / 30.44;
  if (Math.round(months) < 12) return { big: String(Math.round(months)), small: past ? "個月前到期" : "個月後", approx: true };
  const years = Math.max(1, Math.round(a / 365.25 * 2) / 2); // 取到半年
  return { big: String(years), small: past ? "年前到期" : "年後", approx: true };
}
function monthlyCost(it) {
  if (it.kind !== "sub" || !it.amount) return 0;
  if (it.cycle === "年繳") return it.amount / 12; if (it.cycle === "月繳") return it.amount; return 0;
}

/* ============ 儲存 ============ */
const DB_NAME = "expiry-keeper", STORE = "kv";
function openIDB() {
  return new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej(new Error("no idb"));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function loadState() {
  try {
    const db = await openIDB();
    const v = await new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).get("state"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    storageMode = "idb"; return v || null;
  } catch (e) {
    try { const v = localStorage.getItem(DB_NAME); storageMode = "local"; return v ? JSON.parse(v) : null; }
    catch (e2) { storageMode = "memory"; return null; }
  }
}
async function saveState() {
  const data = JSON.parse(JSON.stringify(state));
  if (storageMode === "idb") {
    try {
      const db = await openIDB();
      await new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(data, "state"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      return;
    } catch (e) { storageMode = "local"; }
  }
  if (storageMode === "local") {
    try { localStorage.setItem(DB_NAME, JSON.stringify(data)); return; } catch (e) { storageMode = "memory"; }
  }
  renderBanner();
}
function mergeSettings(s) {
  const out = structuredClone(DEFAULT_SETTINGS);
  if (!s) return out;
  Object.assign(out, s);
  out.ai = Object.assign({}, DEFAULT_SETTINGS.ai, s.ai || {});
  const fresh = (s.rulesVersion || 1) < RULES_VERSION; // 規則表改版時改用新預設
  const rules = !fresh && Array.isArray(s.rules) ? s.rules : [];
  const subRules = !fresh && Array.isArray(s.subRules) ? s.subRules : [];
  out.rules = DEFAULT_RULES.map(d => Object.assign({}, d, rules.find(r => r.cat === d.cat) || {}));
  out.subRules = DEFAULT_SUB_RULES.map(d => Object.assign({}, d, subRules.find(r => r.cat === d.cat) || {}));
  out.rulesVersion = RULES_VERSION;
  delete out.remindItem; delete out.remindSub;
  return out;
}

/* ============ 提示訊息 ============ */
let toastTimer;
function toast(msg, ms = 2600) {
  const root = $("#toast-root"); root.replaceChildren(h("div", { class: "toast", text: msg }));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => root.replaceChildren(), ms);
}
function renderBanner() {
  const slot = $("#banner-slot"); slot.replaceChildren();
  if (storageMode === "memory") slot.append(h("div", { class: "banner", text: IS_ANDROID ? "此瀏覽器無法儲存資料，關閉頁面後資料會消失。請用 Chrome 開啟並「安裝應用程式」後使用。" : "此瀏覽器無法儲存資料，關閉頁面後資料會消失。請用 Safari 開啟並「加入主畫面」後使用。" }));
}

/* ============ 圖示 ============ */
const ICON = {
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',

function fileToJpegBase64(file, maxSide = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ friendly: "無法讀取這張照片，請改用 JPG 或 PNG" }); };
    img.src = url;
  });
}
async function geminiCall(path, init) {
  const key = state.settings.ai.key;
  const sep = path.includes("?") ? "&" : "?";
  let res;
  try { res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${path}${sep}key=${encodeURIComponent(key)}`, init); }
  catch (e) { throw { friendly: "無法連線到 Gemini，請確認網路連線" }; }

    if (res.status === 403) throw { friendly: "金鑰沒有權限，請確認已在 Google AI Studio 建立金鑰" };
    if (res.status === 404) throw { friendly: "找不到這個模型，請到設定按「取得可用模型」重新選擇" };
    if (res.status === 429) throw { status: 429, friendly: "今天的免費額度已用完或使用太頻繁，請稍後再試" };
    if (res.status >= 500) throw { status: res.status, friendly: "Google 辨識服務目前忙碌，請稍等一下再試" };

const GEMINI_FALLBACK = "gemini-flash-lite-latest";
async function geminiGenerate(body, onStatus) {
  const primary = state.settings.ai.model || "gemini-flash-latest";
  const tries = [[primary, 0], [primary, 2000], ...(primary !== GEMINI_FALLBACK ? [[GEMINI_FALLBACK, 500]] : [])];
  let lastErr;
  for (let i = 0; i < tries.length; i++) {
    const [model, wait] = tries[i];
    if (wait) { if (onStatus) onStatus(model === primary ? "辨識服務忙碌，自動重試中…" : "改用備援模型辨識中…", null); await new Promise(r => setTimeout(r, wait)); }
    try {
      return await geminiCall(`models/${encodeURIComponent(model)}:generateContent`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (e) {

      if (!(e.status >= 500 || e.status === 429)) throw e;
    }
  }

}

  if (short.length >= 3 && long.includes(short)) return true; // 一個品名包含另一個
  let p = 0; while (p < short.length && short[p] === long[p]) p++;

  return (2 * hit) / (A.length + B.length) >= 0.6; // 字詞相似度

/* ============ 平台判斷 ============ */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__installPrompt = e; });
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_STANDALONE = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// Google 日曆新增事件連結（Android 單筆使用；提醒時間依 Google 日曆預設）
function googleCalUrl(it) {
  const d = it.expiry.replace(/-/g, ""), d2 = addDays(it.expiry, 1).replace(/-/g, "");
  const label = it.kind === "sub" ? (it.autoRenew ? "續訂" : "到期") : "到期";
  const info = it.kind === "sub"
    ? `${it.plan ? it.plan + "・" : ""}${it.amount ? money(it.amount) + "／" + it.cycle + "・" : ""}${it.autoRenew ? "自動續訂" : "手動續訂"}`
    : `${it.location}・${it.category}${it.qty ? "・" + it.qty + (it.unit || "") : ""}`;
  const details = `${info}${it.note ? "\n" + it.note : ""}\n建議提醒：提前 ${it.remindDays || 0} 天（請在 Google 日曆的「通知」設定）\n（效期管家）`;
  const q = new URLSearchParams({ action: "TEMPLATE", text: `【${label}】${it.name}`, dates: `${d}/${d2}`, details });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

/* ============ 檔案輸出（行事曆／備份） ============ */
async function deliverFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const isIOS = IS_IOS;
  if (mime === "text/calendar" && isIOS) {
    // iOS：以 Safari 開啟 .ics 會直接出現「加入行事曆」畫面
    const url = URL.createObjectURL(blob);
    const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); return;
  }
  const f = new File([blob], name, { type: mime });
  // iPhone 備份檔、Android 的 .ics 與備份檔：優先用分享選單（Android 可直接選日曆 App 開啟）
  if ((isIOS || IS_ANDROID) && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: name }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function icsEscape(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1"); }
function icsFold(line) {
  const out = []; let cur = ""; let bytes = 0; const enc = new TextEncoder();
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 73) { out.push(cur); cur = " " + ch; bytes = 1 + b; } else { cur += ch; bytes += b; } }
  out.push(cur); return out.join("\r\n");
}
function buildICS(items, hour = state.settings.alarmHour) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ExpiryKeeper//效期管家//ZH-TW", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  for (const it of items) {
    if (!isISO(it.expiry)) continue;
    const d = it.expiry.replace(/-/g, ""), d2 = addDays(it.expiry, 1).replace(/-/g, "");
    const label = it.kind === "sub" ? (it.autoRenew ? "續訂" : "到期") : "到期";
    const desc = it.kind === "sub"
      ? `${it.plan ? it.plan + "・" : ""}${it.amount ? money(it.amount) + "／" + it.cycle + "・" : ""}${it.autoRenew ? "自動續訂" : "手動續訂"}${it.note ? "\n" + it.note : ""}`
      : `${it.location}・${it.category}${it.qty ? "・" + it.qty + (it.unit || "") : ""}${it.note ? "\n" + it.note : ""}`;
    L.push("BEGIN:VEVENT", `UID:${it.id}@expiry-keeper`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d2}`,
      `SUMMARY:${icsEscape(`【${label}】${it.name}`)}`, `DESCRIPTION:${icsEscape(desc + "\n（效期管家）")}`, "TRANSP:TRANSPARENT");
    const n = Math.max(0, parseInt(it.remindDays, 10) || 0);
    const trig = (daysBefore) => { const hrs = daysBefore * 24 - hour; return hrs > 0 ? `TRIGGER:-PT${hrs}H` : `TRIGGER:PT${-hrs}H`; };
    if (n > 0) L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(`${it.name} 將在 ${n} 天後${label}`)}`, trig(n), "END:VALARM");
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(`${it.name} 今天${label}`)}`, trig(0), "END:VALARM");
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function exportICS(items, name) { deliverFile(name, buildICS(items), "text/calendar"); }
function exportBackup() {
  const data = { app: "expiry-keeper", version: 1, exportedAt: new Date().toISOString(), items: state.items, settings: { ...state.settings, ai: { key: "", model: state.settings.ai.model } } };
  deliverFile(`效期管家備份-${today()}.json`, JSON.stringify(data, null, 2), "application/json");
}

/* ============ 共用密碼 ============ */
// 程式碼只存密碼的 SHA-256 雜湊值（不存原文）；空字串＝不啟用密碼
const PASS_HASH = "e9465fbabbd91772a68fd8e9a810c262e991b69ac7b2e600749585b401270452";
async function sha256(t) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function showLock() {
  return new Promise(resolve => {
    const input = h("input", { type: "password", id: "lock-pw", autocomplete: "current-password", placeholder: "輸入共用密碼" });
    const msg = h("div", { class: "help", style: "min-height:22px" });
    const btn = h("button", { class: "btn block", type: "submit" }, "解鎖");
    const form = h("form", { class: "lock-card" },
      h("span", { class: "capsule" }, "效期・訂閱管理"),
      h("h1", { class: "lock-title", text: "效期管家" }),
      h("p", { class: "lock-sub", text: "請輸入共用密碼。每支手機只需輸入一次。" }),
      h("div", { class: "f" }, h("label", { for: "lock-pw", text: "共用密碼" }), input), msg, btn);
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); btn.disabled = true;
      const v = input.value.trim();
      const ok = v && (await sha256(v)) === PASS_HASH;
      if (!ok) { msg.className = "help bad"; msg.textContent = "密碼不正確，請再試一次"; btn.disabled = false; input.select(); return; }
      state.unlockedHash = PASS_HASH; await saveState();
      lock.remove(); document.body.style.overflow = ""; resolve();
    });
    const lock = h("div", { class: "lock" }, form);
    document.body.append(lock); document.body.style.overflow = "hidden";
    setTimeout(() => input.focus(), 50);
  });
}

/* ============ 啟動 ============ */
(async function boot() {
  const saved = await loadState();
  if (saved && Array.isArray(saved.items)) {
    state.items = saved.items.map(i => LEGACY_CATS[i.category] ? { ...i, category: LEGACY_CATS[i.category] } : i);
    state.settings = mergeSettings(saved.settings);
  }
  if (saved && saved.unlockedHash) state.unlockedHash = saved.unlockedHash;
  applyPalette(state.settings.palette);
  if (window.__PREVIEW__ && !state.items.length) await loadExamples();
  if (PASS_HASH && state.unlockedHash !== PASS_HASH) await showLock();
  render();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.__PREVIEW__) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  // 跨日自動更新
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });
})();
